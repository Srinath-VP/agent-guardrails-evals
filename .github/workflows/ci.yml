name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit and layering tests
        run: pytest -q
      - name: Guardrail evals (regression gate)
        run: python -m agent_guardrails.evals --json eval-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-summary
          path: eval-summary.json
